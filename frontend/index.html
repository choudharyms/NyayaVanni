<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="NyayaVanni is an AI-powered legal assistant that simplifies Indian legal documents." />
    <title>NyayaVanni — AI-Powered Legal Assistant</title>

    <script>
      // Apply the saved or system color-scheme before paint to avoid a
      // flash of the wrong theme (FOUC).
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('nyaya_theme');
        } catch (e) {}
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)')
          .matches;
        var isDark =
          stored === 'dark' || (stored === null && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
